<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#04050a" />
    <title>없는 주소 | 미리내</title>
    <!-- GitHub Pages가 /mirinae/ 아래의 없는 경로에 이 파일을 보낸다. 깊은 경로에서도 열리도록 링크는 프로젝트 기준 절대 경로로 쓴다. -->
    <link rel="icon" type="image/svg+xml" href="/mirinae/icon.svg" />
    <style>
      :root {
        --bg: #04050a;
        --panel: rgba(9, 11, 22, 0.86);
        --line: rgba(232, 226, 210, 0.14);
        --text: #ece7da;
        --muted: #a6abbe;
        --gold: #ecc879;
        --focus: #ffe2a0;
        --space: clamp(1rem, 4vw, 2rem);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--space);
        background: radial-gradient(ellipse at 50% 40%, #11131f 0%, var(--bg) 70%);
        color: var(--text);
        font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 30rem;
        padding: var(--space);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        text-align: center;
      }
      .kicker { margin: 0; color: var(--muted); font-size: 0.875rem; letter-spacing: 0.08em; }
      h1 { margin: 0.25rem 0 0.75rem; color: var(--gold); font-family: "Batang", serif; font-size: clamp(1.75rem, 6vw, 2.25rem); }
      p { margin: 0 0 1.5rem; }
      a {
        display: inline-block;
        padding: 0.65em 1.4em;
        border-radius: 999px;
        background: var(--gold);
        color: var(--bg);
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: var(--focus); }
      a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">MIRINAE · 은하 탐사기</p>
      <h1>없는 좌표</h1>
      <p>이 주소에는 은하가 없습니다. 주소가 바뀌었거나 잘못 입력됐을 수 있습니다.</p>
      <a href="/mirinae/">미리내 은하로 가기</a>
    </main>
  </body>
</html>
