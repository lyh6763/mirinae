name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PR에서는 린트·테스트·타입 검사·빌드까지만 하고 배포하지 않는다.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포(main 푸시·수동 실행)가 겹치면 진행 중인 것을 끝까지 마친다.
# PR 검사는 PR마다 따로 묶는다. 같은 pages 그룹에 들어가면 대기 중인 배포를 밀어내 취소시킬 수 있다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Oxlint·Stylelint. 경고가 하나라도 있으면 멈춘다.
      - run: npm run lint

      # 테스트가 실패하면 배포하지 않는다.
      - run: npm test

      # 타입 검사 → vite build. 해시 좌표라 SPA 폴백은 필요 없다(잘못된 경로는 public/404.html).
      - run: npm run build

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      # v4부터 점(.)으로 시작하는 파일은 올리지 않는다. dist에는 그런 파일이 없다.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # main 푸시와 main에서의 수동 실행만 배포한다.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
